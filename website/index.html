<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>body{font:18px/1.7 system-ui;background:#f7f2e9;color:#302c27;margin:auto;padding:3rem 1.3rem;max-width:900px}header{border-bottom:1px solid #b7a88e;margin-bottom:2rem}article{background:#fffaf3;padding:1.4rem;margin:1rem 0;border-radius:12px}a{color:#69512d}h1{font-size:clamp(2rem,6vw,3.4rem)}h2{margin-top:0}</style></head>
<body><header><h1>{{TITLE}}</h1></header><main>{{BODY}}</main>
<style>.person{background:#fffaf3;border:1px solid #e0d5c4;border-radius:14px;margin:1rem 0;padding:1rem 1.3rem}.person summary{cursor:pointer}.person summary h2{display:inline;font-size:1.3rem}.dates{font-size:.95rem}.dates p{margin:.15rem 0}.expand{font-size:.85rem;color:#69512d}.person[open]{padding:1.7rem;box-shadow:0 8px 28px #302c2714}.person[open] summary h2{font-size:1.8rem}.person-content{padding-top:1rem}.person-content img{display:block;max-width:100%;max-height:480px;object-fit:contain;border-radius:8px}.biography{white-space:pre-line}.person figure{margin:1.2rem 0}.person summary:focus-visible{outline:3px solid #69512d;outline-offset:6px}.family{padding:1rem;border-top:1px solid #b7a88e}</style>
<style>.journey{margin:2rem 0}.journey-event{border-inline-start:3px dashed #9a8059;padding:1rem;margin:0 0 0 1rem}.journey-event summary{cursor:pointer}.journey-event summary span{display:block;font-size:.9rem}.journey img{max-width:100%;max-height:440px;object-fit:contain}.journey-routes{display:flex;gap:1rem;flex-wrap:wrap}.journey-routes nav{flex:1;min-width:180px;border:1px dashed #9a8059;border-radius:12px;padding:1rem}.journey-routes nav>span:first-child{display:block;font-weight:bold}</style>
<script>function openLinkedPerson(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(el&&el.matches('details')){el.open=true;let p=el.parentElement;while(p){if(p.matches('details'))p.open=true;p=p.parentElement;}}}addEventListener('hashchange',openLinkedPerson);openLinkedPerson();</script>
</body></html>
